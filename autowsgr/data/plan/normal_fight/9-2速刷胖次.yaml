# 功能：9-2速刷胖次
# 索敌条件：
# 配置：85A3海伦娜炽热不挠大凤

# MapLevel
chapter: 9
map: 2
selected_nodes: [A, E, D, G, H, M, O]
repair_mode: 2   #1中破修，2大破修
# NodeLevel
node_defaults:
  enemy_rules:
    - [AP != 1, detour]
  formation: 4 # 正常情况阵型选择, 1-5
  night: False # 是否夜战
  SL_when_detour_fails: True # 是否迂回失败后退出
  SL_when_spot_enemy_fails: True
  proceed: True # 结束后是否继续

node_args:
  O:
    enemy_rules:
    - [AP != 1, retreat]
    proceed: False # 结束后是否继续
  E:
    enemy_rules:
    - [AP != 1, retreat]
